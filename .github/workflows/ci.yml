name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/events_test?replicaSet=rs0&directConnection=true
      DATABASE_URL: mongodb://127.0.0.1:27017/events_test?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB (single-node replica set for transactions)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
